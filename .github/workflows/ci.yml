name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate README structure
        shell: bash
        run: |
          test -s README.md
          grep -q "AWS Free Tier" README.md
          grep -q "Monitoring" README.md
          grep -q "Roadmap" README.md
          grep -q "FAQ" README.md
